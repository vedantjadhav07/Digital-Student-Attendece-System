# Nginx Reverse Proxy Configuration for Lab-Secure
# Place in /etc/nginx/sites-available/labsecure and symlink to /etc/nginx/sites-enabled/

upstream labsecure_app {
    server 127.0.0.1:5000;
}

# Rate limiting zone for login and attendance submission
limit_req_zone $binary_remote_addr zone=attendance_limit:10m rate=15r/m;

server {
    listen 80;
    server_name labsecure.college.internal;

    # Redirect all HTTP traffic to HTTPS (Recommended in production)
    # return 301 https://$host$request_uri;

    client_max_body_size 16M;

    # Static assets serving directly via Nginx
    location /static/ {
        alias /var/www/labsecure/app/static/;
        expires 7d;
        add_header Cache-Control "public, no-transform";
    }

    # Health check endpoint
    location /health {
        proxy_pass http://labsecure_app/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # Main Application Proxy
    location / {
        proxy_pass http://labsecure_app;
        proxy_http_version 1.1;

        # WebSocket Upgrade Headers
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Real Client IP Headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for WebSockets
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Rate-limited Attendance API
    location /attendance/submit {
        limit_req zone=attendance_limit burst=5 nodelay;
        proxy_pass http://labsecure_app/attendance/submit;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

