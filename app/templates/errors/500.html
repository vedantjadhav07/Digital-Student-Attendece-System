{% extends "base/base.html" %}

{% block title %}Server Error (500){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-warning mb-3">500</div>
    <h3 class="fw-bold text-dark mb-2">Internal Server Error</h3>
    <p class="text-muted small mx-auto mb-4" style="max-width: 460px;">
        An unexpected error occurred while processing this operation. Our system has logged this incident.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">Return to Safety</a>
</div>
{% endblock %}
