{% extends "base/base.html" %}

{% block title %}Page Not Found (404){% endblock %}

{% block content %}
<div class="text-center py-5">
    <div class="display-1 fw-bold text-primary mb-3">404</div>
    <h3 class="fw-bold text-dark mb-2">Page Not Found</h3>
    <p class="text-muted small mx-auto mb-4" style="max-width: 460px;">
        The requested attendance route or resource does not exist or has been relocated.
    </p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary px-4">Return to Dashboard</a>
</div>
{% endblock %}
